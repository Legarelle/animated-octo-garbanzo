<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company summaries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="brand-mark">CS</div><div><div class="brand-title">Company summaries</div><div class="brand-sub">Due diligence review</div></div></div>
  <div class="search-wrap"><input id="filter" aria-label="Filter companies" placeholder="Search company or ID"></div>
  <ul id="companies"></ul>
</aside>
<main id="company"><p class="muted">Pick a company.</p></main>
<section>
  <h2>Executive summary</h2>
  <div class="side-by-side">
    <label>Version <select id="versionA"></select></label>
    <label>Compare with <select id="versionB"></select></label>
  </div>
  <div id="summaries" class="side-by-side"></div>
</section>
</div>
<script src="app.js"></script>
</body>
</html>
